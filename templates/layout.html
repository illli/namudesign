<!doctype html>
<html lang="{html_lang}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{page_title}</title>
    <meta name="description" content="{page_description}">
    <link rel="canonical" href="{canonical_url}">
    <link rel="alternate" hreflang="zh-CN" href="{zh_url}">
    <link rel="alternate" hreflang="en" href="{en_url}">
    <link rel="alternate" hreflang="x-default" href="{default_url}">
    <meta property="og:type" content="{og_type}">
    <meta property="og:site_name" content="{brand}">
    <meta property="og:title" content="{page_title}">
    <meta property="og:description" content="{page_description}">
    <meta property="og:url" content="{canonical_url}">
    <script src="/assets/js/theme-init.js"></script>
    <link rel="stylesheet" href="/assets/css/site.css">
  </head>
  <body data-page="{page_key}">
    <a class="skip-link" href="#main">{skip_label}</a>
    <header class="site-header">
      <a class="brand" href="{home_url}" aria-label="{brand}"><img src="/assets/images/brand/namu-wordmark.svg" alt=""></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">{menu_label}</button>
      <nav id="site-nav" class="site-nav" aria-label="{menu_label}">
        <a href="{info_url}"{info_current}>INFO</a>
        <a href="{work_url}"{work_current}>WORK</a>
        <a href="{other_locale_url}" lang="{other_html_lang}" hreflang="{other_html_lang}">{other_language_name}</a>
        <button class="theme-toggle" type="button" aria-label="{theme_label}" aria-pressed="false"><span aria-hidden="true">DARK</span></button>
      </nav>
    </header>
    <main id="main">
{body}
    </main>
    <footer class="site-footer">
      <div><span>{footer_address}</span></div>
      <div><a href="tel:{footer_phone_href}">{footer_phone}</a><a href="mailto:{footer_email}">{footer_email}</a></div>
      <p>© {year} {brand}</p>
    </footer>
    <script src="/assets/js/site.js" defer></script>
  </body>
</html>
