<!doctype html>
<html lang="{html_lang}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{page_title}</title>
    <meta name="description" content="{page_description}">
    <link rel="canonical" href="{canonical_url}">
    <link rel="alternate" hreflang="zh-CN" href="{zh_url}">
    <link rel="alternate" hreflang="en" href="{en_url}">
    <link rel="alternate" hreflang="x-default" href="{default_url}">
    <meta property="og:type" content="{og_type}">
    <meta property="og:site_name" content="{brand}">
    <meta property="og:title" content="{page_title}">
    <meta property="og:description" content="{page_description}">
    <meta property="og:url" content="{canonical_url}">
    <script src="/assets/js/theme-init.js"></script>
    <link rel="stylesheet" href="/assets/css/site.css?v=20260902b">
  </head>
  <body data-page="{page_key}">
    <a class="skip-link" href="#main">{skip_label}</a>
    <header class="site-header">
      <a class="brand" href="{home_url}" aria-label="{brand}"><img src="/assets/images/brand/namu-wordmark.svg" alt=""></a>
      <a class="nav-info" href="{info_url}" aria-label="INFO"{info_current}>
        <img class="nav-info-display" src="/assets/images/navigation/info-display.svg" alt="">
        <img class="nav-info-case" src="/assets/images/navigation/info-case.png" alt="">
      </a>
    </header>
    <main id="main">
{body}
    </main>
    <footer class="site-footer">
      <div class="footer-address">
        <span>{footer_address_label}</span>
        <p>{footer_address_html}</p>
      </div>
      <div class="footer-phone">
        <span>{footer_phone_label}</span>
        <a href="tel:{footer_phone_href}">{footer_phone}</a>
      </div>
      <div class="footer-email">
        <span>{footer_consult_label}</span>
        <a href="mailto:{footer_email}">{footer_email}</a>
      </div>
      <p class="footer-copyright">© {year} {brand_compact}</p>
      <div class="footer-controls">
        <a href="{other_locale_url}" lang="{other_html_lang}" hreflang="{other_html_lang}">{other_language_name}</a>
        <button class="theme-toggle" type="button" aria-label="{theme_label}" aria-pressed="false">
          <img class="theme-icon theme-icon--moon" src="/assets/icons/moon.svg" alt="" aria-hidden="true">
          <img class="theme-icon theme-icon--sun" src="/assets/icons/sun.svg" alt="" aria-hidden="true">
        </button>
      </div>
    </footer>
    <script src="/assets/js/site.js?v=20260902b" defer></script>
  </body>
</html>
