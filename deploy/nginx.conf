server {
    listen 80;
    listen [::]:80;
    server_name namu.design www.namu.design;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://namu.design$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.namu.design;

    ssl_certificate /etc/letsencrypt/live/namu.design/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/namu.design/privkey.pem;
    return 301 https://namu.design$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name namu.design;

    root /var/www/namu/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/namu.design/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/namu.design/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = / {
        return 302 /zh/;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
